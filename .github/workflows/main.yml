name: Secure Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-windows-rdp
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Secure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          # Enforce Network Level Authentication
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          # Use TLS security layer
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" -Value 2

          # High encryption level
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "MinEncryptionLevel" -Value 3

          # Remove previous custom firewall rule
          Remove-NetFirewallRule -DisplayName "Secure-Tailscale-RDP" `
            -ErrorAction SilentlyContinue

          # Allow RDP ONLY from Tailscale IP range
          New-NetFirewallRule `
            -DisplayName "Secure-Tailscale-RDP" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          # Start Remote Desktop service
          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "Secure RDP configuration completed."

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "RDP" -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires
          }

          # Add to Remote Desktop Users only, NOT Administrators
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"
          Add-LocalGroupMember `
            -Group $rdpGroup `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP account configured."

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          Remove-Item $installer -Force

          Write-Host "Tailscale installed."

      - name: Connect to Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          Start-Service -Name Tailscale

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {
            $result = & $ts ip -4

            if ($LASTEXITCODE -eq 0 -and $result) {
              $tsIP = ($result | Select-Object -First 1).Trim()
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
            throw "Could not obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected."
          Write-Host "Private RDP IP: $tsIP"

      - name: Verify RDP Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $listener = $false

          for ($i = 0; $i -lt 30; $i++) {
            $listener = Get-NetTCPConnection `
              -State Listen `
              -LocalPort 3389 `
              -ErrorAction SilentlyContinue

            if ($listener) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $listener) {
            throw "RDP listener is not active."
          }

          Write-Host "RDP listener is active."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      - name: RDP Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== SECURE RDP =========="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : RDP"
          Write-Host "Password : Stored securely in GitHub Secrets"
          Write-Host "================================"
          Write-Host ""

      - name: Maintain RDP Session
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] Secure RDP is running."
            Start-Sleep -Seconds 60
          }
