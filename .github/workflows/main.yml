
name: Secure Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-windows-rdp
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      # STEP 1: Configure Windows RDP
      - name: Configure Secure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          # Enforce TLS security layer
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" -Value 2

          # High encryption
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "MinEncryptionLevel" -Value 3

          # Remove old custom RDP rules
          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName "Secure-Tailscale-RDP" -ErrorAction SilentlyContinue

          # Disable built-in broad RDP firewall rules
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Allow RDP only from Tailscale IPv4 range
          New-NetFirewallRule `
            -DisplayName "Secure-Tailscale-RDP" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          # Start RDP service
          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "Secure RDP configured."

      # STEP 2: Create RDP User
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "RDP" -Password $securePassword
            Enable-LocalUser -Name "RDP"
          }
          else {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires
          }

          # Add user to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP account created."

      # STEP 3: Install Tailscale
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

          Remove-Item $installer -Force

          Write-Host "Tailscale installed."

      # STEP 4: Connect Using Reusable Auth Key
      - name: Connect to Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          Start-Service -Name Tailscale

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed."
          }

          # Get Tailscale IP
          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {
            $result = & $ts ip -4

            if ($LASTEXITCODE -eq 0 -and $result) {
              $tsIP = ($result | Select-Object -First 1).Trim()
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
            throw "Tailscale IP not assigned."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected."
          Write-Host "Private IP: $tsIP"

      # STEP 5: Verify RDP
      - name: Verify RDP Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $listener = $null

          for ($i = 0; $i -lt 30; $i++) {
            $listener = Get-NetTCPConnection `
              -State Listen `
              -LocalPort 3389 `
              -ErrorAction SilentlyContinue

            if ($listener) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $listener) {
            throw "RDP listener not found."
          }

          Write-Host "RDP listener active."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      # STEP 6: Display Connection Details
      - name: RDP Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== SECURE RDP =========="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : RDP"
          Write-Host "Password : Check GitHub Secret RDP_PASSWORD"
          Write-Host "================================"

      # STEP 7: Maintain Connection
      - name: Maintain RDP Session
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] Secure RDP running."
            Start-Sleep -Seconds 60
          }

      # STEP 8: Cleanup
      - name: Tailscale Cleanup
        if: always()
        shell: powershell
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {
            & $ts logout
          }

          Write-Host "Tailscale cleanup completed."
